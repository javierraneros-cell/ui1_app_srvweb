<!DOCTYPE html >
<html lang="es" id="formulario-contacto" >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto - Formación Global Online</title>

    <!-- Hojas de estilo -->
    <!-- Ponemos antes el css de BOOTSTRAP para que prevalezca el nuestro en caso de confilcto o herencia -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link href="css/estilos.css" rel="stylesheet" type="text/css">
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" >

    <meta name="author" content="Javier Raneros Cartujo" >
    <meta name=description content="Formulario de contacto de la plataforma de cursos en línea de Formación Global Online" >
    <meta name="keywords" content="cursos, formación, profesores, datos abiertos, virtualización, contacto" >
</head>

<!-- Cuerpo de la página Incio / Formulario -->
<body>
    <!-- CABECERA que se repetira en el resto de paginas -->
    <header>
        <!-- H1 Título de la página para validar WAVE -->
        <h1 class="visually-hidden">Formación Global Online</h1>
        <!-- Banner en la cabecera -->
        <div >
            <!-- La clase img-fluid de Bootstrap hace que la imagen sea responsive, es decir, que se adapte al tamaño del contenedor -->
            <!-- Ya no usamos la clase banner en el DIV -->
            <a href="index.html">
                <img class="img-fluid" src="imagenes/bannerFormacionGlobalOnline.png" alt="Formación Global Online banner" >
            </a>
        </div>
        <!-- MENU -->
        <div id="contenedor-menu"></div>
    </header>

    <!-- MAIN -->
    <main id="contenedor-main">
        <h2><span class="material-symbols-outlined">contact_mail</span> Formulario de Contacto</h2>
        <div id="contenedor-respuesta-formulario" class="d-none" role="alert"></div>
        <div id="contenedor-formulario" class="mb-4" >
            <!-- Usamos la clase row de Bootstrap para crear filas y col-sm-x para crear columnas segun necesitemos los anchos -->
            <form id="form-contacto" onsubmit="return enviarFormulario()">
                <div class="row mb-2" >
                    <div class="form-floating col-sm-8" >
                        <input type="text" id="nombre" class="form-control" placeholder="Introduce tu nombre..." required onblur="validaCampo('nombre', 0)" >
                        <label for="nombre" >Nombre</label>
                        <div class="invalid-feedback">
                            Porfavor, introduce un nombre válido.
                        </div>
                    </div>
                    
                    <div class="form-floating col-sm-4" >
                        <input type="email" id="correo" class="form-control" placeholder="Introduce tu correo..." required onblur="validaCorreo()" >
                        <label for="correo" >Correo</label>
                        <div class="invalid-feedback">
                            Porfavor, introduce un correo válido tipo nombre@ejemplo.com
                        </div>
                    </div>
                </div>
                <div class="row mb-3" >
                    <div class="form-floating col-sm-12">
                        <select id="tematica" class="form-select" aria-label="Seleccione temática" required onblur="validaCampo('tematica', 0)">
                            <option value="">Seleccione temática...</option>
                            <option value="Tecnología">Tecnología</option>
                            <option value="Cívicas y Sociales">Cívicas y Sociales</option>
                        </select>
                        <label for="tematica" >Tematica</label>
                        <div class="invalid-feedback">
                            Porfavor, selecciona una temática válida
                        </div>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-sm-12">
                        <textarea id="mensaje" class="form-control mb-2 " rows="5" placeholder="Escribe tu mensaje aquí..." onblur="validaCampo('mensaje', 30)" oninput="cuentaCaracteresMensaje(30)" ></textarea>
                        <div id="contenedor-conteo-mensaje" class="alert-warning" role="alert">
                            <p>Número de caracteres en mensaje:     <span id="conteo-mensaje"></span></p>
                        </div>
                        <div class="invalid-feedback">
                            Porfavor, introduce un mensaje de al menos 30 caracteres
                        </div>
                    </div>
                </div>

                <!-- Enviar -->
                <button type="submit" class="btn btn-outline-primary w-100 mt-3" >Enviar</button>
            </form>
        </div>
    </main>

    <!-- FOOTER -->
    <div id="contenedor-footer"></div>

    <!-- Scripts de Bootstrap y JQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Script para cargar los cursos desde el JSON y ejecutamos la llamada -->
    <script src="js/formularioContacto.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/footer.js"></script>

</body>
</html>
