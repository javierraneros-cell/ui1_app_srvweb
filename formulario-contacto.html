<!DOCTYPE html >
<html lang="es" id="formulario-contacto" >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto - Formación Global Online</title>

    <!-- Hojas de estilo -->
    <!-- Ponemos antes el css de BOOTSTRAP para que prevalezca el nuestro en caso de confilcto o herencia -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link href="css/estilos.css" rel="stylesheet" type="text/css">
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" >

    <meta name="author" content="Javier Raneros Cartujo" >
    <meta name=description content="Formulario de contacto de la plataforma de cursos en línea de Formación Global Online" >
    <meta name="keywords" content="cursos, formación, profesores, datos abiertos, virtualización, contacto" >
</head>

<!-- Cuerpo de la página Incio / Formulario -->
<body>
    <!-- CABECERA que se repetira en el resto de paginas -->
    <header>
        <!-- H1 Título de la página para validar WAVE -->
        <h1 class="visually-hidden">Formación Global Online</h1>
        <!-- Banner en la cabecera -->
        <div >
            <!-- La clase img-fluid de Bootstrap hace que la imagen sea responsive, es decir, que se adapte al tamaño del contenedor -->
            <!-- Ya no usamos la clase banner en el DIV -->
            <a href="index.html">
                <img class="img-fluid" src="imagenes/bannerFormacionGlobalOnline.png" alt="Formación Global Online banner" >
            </a>
        </div>
        <!-- MENU -->
        <div id="contenedor-menu"></div>
    </header>

    <!-- MAIN -->
    <main id="contenedor-main">
        <h2><span class="material-symbols-outlined">contact_mail</span> Formulario de Contacto</h2> 
        <div id="contenedor-formulario" class="mb-4" >
            <!-- Usamos la clase row de Bootstrap para crear una fila y col-sm-2 y col-sm-10 para crear columnas de 2 y 10 respectivamente -->
            <div class="row mb-3" >
                <label for="nombre" class="col-sm-1 col-form-label " >Nombre </label>
                <div class="col-sm-6" >
                    <input type="text" id="nombre" class="form-control"  placeholder="Introduce tu nombre..." >
                </div>
                <label for="email" class="col-sm-1 col-form-label " >Email  </label>
                <div class="col-sm-4" >
                    <input type="email" id="email" class="form-control"  placeholder="Introduce tu email..." >
                </div>

            </div>
            <div class="row mb-3" >
                <label for="tematica" class="col-sm-1 col-form-label " >Tema </label>
                <div class="col-sm-11">
                    <select id="tematica" class="form-select">
                        <option value="">Selecciona temática</option>
                        <option value="Tecnología">Tecnología</option>
                        <option value="Cívicas y Sociales">Cívicas y Sociales</option>
                    </select>
                </div>
            </div>
            <div class="row mb-3">
                <label for="mensaje" class="col-sm-1 col-form-label" >Mensaje </label>
                <div class=" col-sm-11">
                    <textarea id="mensaje" class="form-control" rows="5" placeholder="Escribe tu mensaje aquí..."></textarea>
                </div>
            </div>
            <!-- Enviar -->
            <button id="boton-enviar" class="btn btn-outline-primary w-100 mt-3" onclick="enviarFormulario()" >Enviar</button>
        </div>
        <div id="contenedor-respuesta-formulario" class="alert alert-info d-none" role="alert"></div>
    </main>

    <!-- FOOTER -->
    <div id="contenedor-footer"></div>

    <!-- Scripts de Bootstrap y JQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Script para cargar los cursos desde el JSON y ejecutamos la llamada -->
    <script src="js/formularioContacto.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/footer.js"></script>
    
    <script> cargarCursos(); </script>
</body>
</html>
