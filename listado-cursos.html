<!DOCTYPE html >
<html lang="es" id="listado-cursos" >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado Cursos de Formación Global Online</title>

    <!-- Hojas de estilo -->
    <!-- Ponemos antes el css de BOOTSTRAP para que prevalezca el nuestro en caso de confilcto o herencia -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link href="css/estilos.css" rel="stylesheet" type="text/css">
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" >

    <meta name="author" content="Javier Raneros Cartujo" >
    <meta name=description content="Listado de cursos plataforma de cursos en línea de Formación Global Online" >
    <meta name="keywords" content="cursos, formación, profesores, datos abiertos, virtualización" >
</head>

<!-- Cuerpo de la página Incio / Portada -->
<body>
    <!-- CABECERA que se repetira en el resto de paginas -->
    <header>
        <!-- H1 Título de la página para validar WAVE -->
        <h1 class="visually-hidden">Formación Global Online</h1>
        <!-- Banner en la cabecera -->
        <div >
            <!-- La clase img-fluid de Bootstrap hace que la imagen sea responsive, es decir, que se adapte al tamaño del contenedor -->
            <!-- Ya no usamos la clase banner en el DIV -->
            <a href="index.html">
                <img class="img-fluid" src="imagenes/bannerFormacionGlobalOnline.png" alt="Formación Global Online banner" >
            </a>
        </div>
        <!-- MENU -->
        <div id="contenedor-menu"></div>
    </header>

    <!-- MAIN -->
    <main>
        <h2><span class="material-symbols-outlined">list</span> Listado de cursos formativos impartidos en Formación Global Online</h2> 
        <div id="contenedor-filtro-cursos">
                <input type="text" id="filtro-titulo" class="form-control" oninput="cargarCursos(this.value, document.getElementById('filtro-categoria').value)" placeholder="Buscar curso..." >
                <select id="filtro-categoria" class="form-select" onchange="cargarCursos(document.getElementById('filtro-titulo').value, this.value)" >
                    <option value="">Todas las categorías</option>
                    <option value="Tecnología">Tecnología</option>
                    <option value="Cívicas y Sociales">Cívicas y Sociales</option>
                </select>
                <button id="boton-limpiar-filtros" class="btn btn-outline-primary" onclick="limpiarFiltros()" >Limpiar filtros</button>    
        </div>
        <div id="contenedor-cursos" class="listado-cursos row g-4"  >
            <!-- Aqui la funcion JavaScript cargarCursos() pintara todos los cursos -->
        </div>
        <div id="contenedor-resultado-cursos" class="text-center mt-4" style="display: none;" >
            <!-- Aqui la funcion JavaScript cargarCursos() pintara el resultado de la busqueda -->
        </div>
    </main>

    <!-- FOOTER -->
    <div id="contenedor-footer"></div>

    <!-- Scripts de Bootstrap y JQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Script para cargar los cursos desde el JSON y ejecutamos la llamada -->
    <script src="js/listadoCursos.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/footer.js"></script>
    
    <script> cargarCursos(); </script>
</body>
</html>
