<!DOCTYPE html>
<html lang="es" id="panel-admin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin USUARIOS - Formacion Global Online</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="/css/estilos.css" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap">
</head>
<body>
    <header>
        <h1 class="visually-hidden">Panel Admin - USUARIOS</h1>
        <div>
            <a href="/index.html">
                <img class="img-fluid" src="/imagenes/bannerFormacionGlobalOnline.png" alt="Formación Global Online banner">
            </a>
        </div>
        <div id="contenedor-menu"></div>
    </header>

    <main id="contenedor-main">
        <h2><span class="material-symbols-outlined">manage_accounts</span> Panel Admin - USUARIOS</h2>
        <div id="admin-feedback" class="d-none mb-3" role="alert"></div>
        <div class="mb-3" role="alert">
            <span id="admin-user-info" class="align-self-center"></span>
        </div>

        <section class="card mb-4 mt-4" id="bloque-usuario-admin">
            <h3>Crear / Editar usuario</h3>
            <form id="form-usuario-admin" class="row g-3">
                <input type="hidden" id="usuario-id">

                <div class="col-12 col-md-4">
                    <label for="usuario-nombre" class="form-label">Nombre</label>
                    <input id="usuario-nombre" type="text" class="form-control" required>
                </div>
                <div class="col-12 col-md-4">
                    <label for="usuario-email" class="form-label">Email</label>
                    <input id="usuario-email" type="email" class="form-control" required>
                </div>
                <div class="col-12 col-md-2">
                    <label for="usuario-rol" class="form-label">Rol</label>
                    <select id="usuario-rol" class="form-select" required>
                        <option value="alumno">alumno</option>
                        <option value="admin">admin</option>
                    </select>
                </div>
                <div class="col-12 col-md-2">
                    <label for="usuario-password" class="form-label">Password</label>
                    <input id="usuario-password" type="password" class="form-control">
                </div>
                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Guardar usuario</button>
                    <button id="btn-limpiar-usuario" type="button" class="btn btn-outline-secondary">Limpiar</button>
                </div>
            </form>
        </section>

        <section class="card mt-4" id="bloque-listado-usuarios-admin">
            <h3>Usuarios existentes</h3>
            <div class="table-responsive">
                <table class="table table-striped align-middle" id="tabla-usuarios-admin">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Rol</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="contenedor-footer"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../admin/js/usuarios-admin.js"></script>
    <script src="../js/menu.js"></script>
    <script src="../js/footer.js"></script>
</body>
</html>
