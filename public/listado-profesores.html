<!DOCTYPE html >
<html lang="es" id="listado-profesores" >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado PROFESORADO en Formación Global Online</title>

    <!-- Hojas de estilo -->
    <!-- Ponemos antes el css de BOOTSTRAP para que prevalezca el nuestro en caso de confilcto o herencia -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link href="css/estilos.css" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" >

    <meta name="author" content="Javier Raneros Cartujo" >
    <meta name=description content="Listado profesorado Formación Global Online" >
    <meta name="keywords" content="cursos, formación, profesores, datos abiertos, virtualización" >
</head>



<!-- Cuerpo de la página Incio / Portada -->
<body>
    <!-- CABECERA que se repetira en el resto de paginas -->
    <header>
        <!-- H1 Título de la página para validar WAVE -->
        <h1 class="visually-hidden">Formación Global Online</h1>
        <!-- Banner en la cabecera -->
        <div >
            <!-- La clase img-fluid de Bootstrap hace que la imagen sea responsive, es decir, que se adapte al tamaño del contenedor -->
            <!-- Ya no usamos la clase banner en el DIV -->
            <a href="index.html">
                <img class="img-fluid" src="imagenes/bannerFormacionGlobalOnline.png" alt="Formación Global Online banner" >
            </a>
        </div>
        <!-- MENU -->
        <div id="contenedor-menu"></div>
    </header>

    <!-- DIV Lisatado profesores en modo tabla -->
    <main id="contenedor-main">
        <h2><span class="material-symbols-outlined">school</span> Listado de profesores que imparten cursos formativos en Formación Global Online</h2> 
        <div id="respuesta-profesores" class="d-none mb-3" role="alert"></div>
        <div class="listado-profesores table-responsive" >  
            <table id="tabla-profesores" class="table table-striped align-middle table-sm" >
                <caption>Listado de profesorado recuperado desde MongoDB</caption>
                <thead class="table-light">
                    <tr > 
                        <th data-sort="true" id="cabecera-orden-nombre-0" >Nombre del profesor/a</th> 
                        <th data-sort="true" id="cabecera-orden-especialidad-1" >Área de especialización</th> 
                        <th>Email de contacto</th> 
                        <th data-sort="true" id="cabecera-orden-numcursos-3" >Número de cursos que imparte en la plataforma</th> 
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </main>

    <!-- FOOTER -->
    <div id="contenedor-footer"></div>

    <!-- Scripts de Bootstrap y JQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/listaProfesores.js" ></script>
    <script src="js/menu.js"></script>
    <script src="js/footer.js"></script>
    
</body>
</html>
